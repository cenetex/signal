name: Deterministic Replay

on:
  pull_request:
    paths:
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'tools/signal_replay.c'
      - 'scripts/check_replay_repeatability.py'
      - 'scripts/check_replay_cross_build.py'
      - 'CMakeLists.txt'
      - 'Makefile'
      - '.github/workflows/replay.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'tools/signal_replay.c'
      - 'scripts/check_replay_repeatability.py'
      - 'scripts/check_replay_cross_build.py'
      - 'CMakeLists.txt'
      - 'Makefile'
      - '.github/workflows/replay.yml'
  workflow_dispatch:
    inputs:
      scenario_set:
        description: 'Replay scenario set to compare'
        required: false
        default: fast
        type: choice
        options:
          - fast
          - long

permissions:
  contents: read

concurrency:
  group: replay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SCENARIO_SET: ${{ github.event.inputs.scenario_set || 'fast' }}

jobs:
  native-wasm-replay:
    name: Native vs WASM replay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install replay toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nodejs libasound2-dev libx11-dev libxi-dev libxcursor-dev libgl-dev

      - name: Build native replay
        run: |
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGIT_HASH=${GITHUB_SHA::7}
          cmake --build build --target signal_replay --parallel
          python3 scripts/check_deterministic_build_flags.py build/compile_commands.json

      - name: Build WASM replay
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GIT_HASH="${GITHUB_SHA::7}" \
            emscripten/emsdk:4.0.15 \
            bash -lc '
              emcmake cmake -S . -B build-replay-wasm \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TOOLS=OFF \
                -DBUILD_WASM_REPLAY=ON \
                -DGIT_HASH="$GIT_HASH"
              emmake cmake --build build-replay-wasm --target signal_replay --parallel
            '
          python3 scripts/check_deterministic_build_flags.py build-replay-wasm/compile_commands.json

      - name: Compare native and WASM replay
        run: |
          if [ "$SCENARIO_SET" = "long" ]; then
            python3 scripts/check_replay_cross_build.py \
              ./build/signal_replay \
              ./build-replay-wasm/signal_replay.js \
              --scenario-set long
          else
            python3 scripts/check_replay_cross_build.py \
              ./build/signal_replay \
              ./build-replay-wasm/signal_replay.js
          fi
