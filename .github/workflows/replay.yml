name: Deterministic Replay

on:
  # Pull requests call this workflow from the always-triggered ci.yml after
  # .github/ci-paths.json selects the replay lane.
  workflow_call:
    inputs:
      scenario_set:
        required: false
        default: fast
        type: string
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'tools/signal_replay.c'
      - 'scripts/check_deterministic_build_flags.py'
      - 'scripts/ai_eval_corpus.py'
      - 'scripts/ai_episode_outcomes.py'
      - 'scripts/analyze_ai_episode_outcomes.py'
      - 'scripts/test_ai_episode_outcomes.py'
      - 'scripts/build_replay_bundle.py'
      - 'scripts/check_replay_bundles.py'
      - 'scripts/check_replay_repeatability.py'
      - 'scripts/check_replay_cross_build.py'
      - 'scripts/compare_liblecore_replay.py'
      - 'scripts/test_compare_liblecore_replay.py'
      - 'scripts/hnn_null_corpus.py'
      - 'scripts/calibrate_hnn_confidence.py'
      - 'scripts/test_hnn_calibration.py'
      - 'scripts/run_hnn_mixed_evaluation.py'
      - 'docs/liblecore-pilot/hnn-calibration.json'
      - 'docs/liblecore-pilot/mixed-evaluation.json'
      - 'docs/liblecore-pilot/mixed-evaluation.md'
      - 'CMakeLists.txt'
      - 'Makefile'
      - '.github/workflows/replay.yml'
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
    inputs:
      scenario_set:
        description: 'Replay scenario set to compare'
        required: false
        default: fast
        type: choice
        options:
          - fast
          - long
          - ai-eval-fast
          - ai-eval-long
          - ai-outcomes-fast

permissions:
  contents: read

concurrency:
  group: replay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SCENARIO_SET: ${{ inputs.scenario_set || github.event.inputs.scenario_set || 'fast' }}

jobs:
  native-wasm-replay:
    if: github.event_name != 'schedule'
    name: Linux x64 native and WASM replay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install replay toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nodejs libasound2-dev libx11-dev libxi-dev libxcursor-dev libgl-dev

      - name: Build native replay
        run: |
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGIT_HASH="${GITHUB_SHA::7}"
          cmake --build build --target signal_replay --parallel
          ./build/signal_replay --self-test-public-hash
          python3 scripts/check_deterministic_build_flags.py build/compile_commands.json

      - name: Build liblecore native replay variants
        run: |
          for backend in lecore-direct lecore-radix2; do
            cmake -G Ninja -S . -B "build-${backend}" \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DSIGNAL_HNN_BACKEND="$backend" \
              -DGIT_HASH="${GITHUB_SHA::7}"
            cmake --build "build-${backend}" --target signal_replay --parallel
            python3 scripts/check_deterministic_build_flags.py \
              "build-${backend}/compile_commands.json"
          done

      - name: Build WASM replay
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GIT_HASH="${GITHUB_SHA::7}" \
            emscripten/emsdk:4.0.15 \
            bash -lc '
              emcmake cmake -S . -B build-replay-wasm \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TOOLS=OFF \
                -DBUILD_WASM_REPLAY=ON \
                -DGIT_HASH="$GIT_HASH"
              emmake cmake --build build-replay-wasm --target signal_replay --parallel
            '
          python3 scripts/check_deterministic_build_flags.py build-replay-wasm/compile_commands.json

      - name: Validate AI episode outcome contracts
        run: |
          python3 scripts/test_ai_episode_outcomes.py
          python3 scripts/test_compare_liblecore_replay.py
          python3 scripts/test_hnn_calibration.py

      - name: Verify frozen HNN confidence calibration
        run: |
          python3 scripts/calibrate_hnn_confidence.py \
            --builtin build/signal_replay \
            --direct build-lecore-direct/signal_replay \
            --radix2 build-lecore-radix2/signal_replay \
            --artifact docs/liblecore-pilot/hnn-calibration.json \
            --header shared/holographic_nn_calibration_data.h \
            --check

      - name: Verify runtime HNN shadow versus mixed evaluation
        run: |
          python3 scripts/run_hnn_mixed_evaluation.py \
            --builtin build/signal_replay \
            --direct build-lecore-direct/signal_replay \
            --radix2 build-lecore-radix2/signal_replay \
            --output /tmp/hnn-mixed-evaluation.json \
            --markdown /tmp/hnn-mixed-evaluation.md
          cmp docs/liblecore-pilot/mixed-evaluation.json \
            /tmp/hnn-mixed-evaluation.json
          cmp docs/liblecore-pilot/mixed-evaluation.md \
            /tmp/hnn-mixed-evaluation.md

      - name: Preserve AI outcome facts across native and WASM
        run: |
          python3 scripts/build_replay_bundle.py \
            ./build/signal_replay \
            replay-bundles/ai-outcomes-linux-x64 \
            --scenario-set ai-outcomes-fast \
            --decision-mode teacher
          python3 scripts/build_replay_bundle.py \
            ./build-replay-wasm/signal_replay.js \
            replay-bundles/ai-outcomes-wasm \
            --scenario-set ai-outcomes-fast \
            --decision-mode teacher
          python3 scripts/check_replay_bundles.py \
            replay-bundles/ai-outcomes-linux-x64 \
            replay-bundles/ai-outcomes-wasm

      - name: Compare teacher shadow mixed and active outcomes
        run: |
          for mode in teacher shadow mixed active; do
            python3 scripts/build_replay_bundle.py \
              ./build/signal_replay \
              "replay-bundles/ai-outcomes-${mode}" \
              --scenario-set ai-outcomes-fast \
              --decision-mode "$mode"
          done
          python3 scripts/analyze_ai_episode_outcomes.py \
            teacher=replay-bundles/ai-outcomes-teacher \
            shadow=replay-bundles/ai-outcomes-shadow \
            mixed=replay-bundles/ai-outcomes-mixed \
            active=replay-bundles/ai-outcomes-active

      - name: Export Linux x64 native replay bundle
        run: |
          python3 scripts/build_replay_bundle.py \
            ./build/signal_replay \
            replay-bundles/linux-x64 \
            --scenario-set "$SCENARIO_SET"

      - name: Export WASM replay bundle
        run: |
          python3 scripts/build_replay_bundle.py \
            ./build-replay-wasm/signal_replay.js \
            replay-bundles/wasm \
            --scenario-set "$SCENARIO_SET"

      - name: Export liblecore native replay bundles
        run: |
          for backend in lecore-direct lecore-radix2; do
            python3 scripts/build_replay_bundle.py \
              "./build-$backend/signal_replay" \
              "replay-bundles/$backend-linux-x64" \
              --scenario-set "$SCENARIO_SET"
          done

      - name: Preserve native versus WASM gate
        run: |
          python3 scripts/check_replay_bundles.py \
            replay-bundles/linux-x64 \
            replay-bundles/wasm

      - name: Compare built-in and liblecore replay outcomes
        run: |
          extra=()
          if [[ "$SCENARIO_SET" != "fast" ]]; then
            extra+=(--allow-no-hnn)
          fi
          python3 scripts/compare_liblecore_replay.py \
            --builtin replay-bundles/linux-x64 \
            --direct replay-bundles/lecore-direct-linux-x64 \
            --radix2 replay-bundles/lecore-radix2-linux-x64 \
            --report replay-bundles/liblecore-comparison.json \
            "${extra[@]}"

      - name: Upload Linux x64 replay bundle
        uses: actions/upload-artifact@v4
        with:
          name: replay-linux-x64
          path: replay-bundles/linux-x64
          retention-days: 14

      - name: Upload WASM replay bundle
        uses: actions/upload-artifact@v4
        with:
          name: replay-wasm
          path: replay-bundles/wasm
          retention-days: 14

  macos-arm-replay:
    if: github.event_name != 'schedule'
    name: macOS ARM replay
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Build native replay
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGIT_HASH="${GITHUB_SHA::7}"
          cmake --build build --target signal_replay --parallel
          ./build/signal_replay --self-test-public-hash
          python3 scripts/check_deterministic_build_flags.py build/compile_commands.json

      - name: Export macOS ARM replay bundle
        run: |
          python3 scripts/build_replay_bundle.py \
            ./build/signal_replay \
            replay-bundles/macos-arm64 \
            --scenario-set "$SCENARIO_SET"

      - name: Upload macOS ARM replay bundle
        uses: actions/upload-artifact@v4
        with:
          name: replay-macos-arm64
          path: replay-bundles/macos-arm64
          retention-days: 14

  cross-runner-replay:
    if: github.event_name != 'schedule'
    name: Cross-runner replay bundle
    needs: [native-wasm-replay, macos-arm-replay]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux x64 replay bundle
        uses: actions/download-artifact@v7
        with:
          name: replay-linux-x64
          path: replay-bundles/linux-x64

      - name: Download macOS ARM replay bundle
        uses: actions/download-artifact@v7
        with:
          name: replay-macos-arm64
          path: replay-bundles/macos-arm64

      - name: Download WASM replay bundle
        uses: actions/download-artifact@v7
        with:
          name: replay-wasm
          path: replay-bundles/wasm

      - name: Compare runner bundles
        run: |
          python3 scripts/check_replay_bundles.py \
            replay-bundles/linux-x64 \
            replay-bundles/macos-arm64 \
            replay-bundles/wasm

  scheduled-ai-eval-native:
    if: github.event_name == 'schedule'
    name: Scheduled native AI evaluation corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install replay toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libasound2-dev libx11-dev libxi-dev libxcursor-dev libgl-dev

      - name: Build native replay
        run: |
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGIT_HASH="${GITHUB_SHA::7}"
          cmake --build build --target signal_replay --parallel
          python3 scripts/check_deterministic_build_flags.py build/compile_commands.json

      - name: Export long AI evaluation bundle
        run: |
          python3 scripts/build_replay_bundle.py \
            ./build/signal_replay \
            replay-bundles/ai-eval-native \
            --scenario-set ai-eval-long

      - name: Upload long AI evaluation bundle
        uses: actions/upload-artifact@v4
        with:
          name: replay-ai-eval-native
          path: replay-bundles/ai-eval-native
          retention-days: 30
