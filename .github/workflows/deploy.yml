name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  # Per-ref so PR runs don't cancel each other. Multiple PRs were colliding
  # on a shared "deploy" group, killing tests mid-flight. The deploy job
  # further down still only fires on main, so deploys remain serialized.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Fast gate: build once, run fast tests with -Werror.
  # On failure, cancels the whole run so siblings (native matrix,
  # static analysis, CRAP, docker push) don't keep burning minutes.
  # Soak tests run in their own job (test-soak below) so this job
  # stays under ~3 minutes on the GHA runner.
  test-basic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build and run fast tests
        run: |
          cmake -S . -B build-test -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS_ONLY=ON \
            -DCMAKE_C_FLAGS="-Werror" -DCMAKE_C_FLAGS_DEBUG="-O2 -g"
          cmake --build build-test --parallel
          ulimit -s 16384
          ./build-test/signal_test --no-soak
      - name: Cancel sibling jobs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }} || true

  # Soak gate: long-horizon multi-actor sim tests (autopilot scenarios,
  # e2e contract lifecycle, multi-thousand-tick conservation runs).
  # ~75% of total suite wall-clock; run in its own job in parallel
  # with test-basic so PR turnaround stays fast. Same -Werror / -O2
  # build as test-basic for parity.
  test-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build and run soak tests
        run: |
          cmake -S . -B build-test -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS_ONLY=ON \
            -DCMAKE_C_FLAGS="-Werror" -DCMAKE_C_FLAGS_DEBUG="-O2 -g"
          cmake --build build-test --parallel
          ulimit -s 16384
          ./build-test/signal_test --soak-only

  # ASan: post-deploy verification on main only. Runs off the PR path
  # because it costs several minutes; test-basic + native
  # (linux/macos/windows) catch the vast majority of regressions on the
  # PR loop in <5 min, while ASan backstops them after deploy lands.
  # Shard it so one slow test bucket cannot consume the whole main tail.
  test-asan:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      ASAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v6
      - name: Build and run tests with AddressSanitizer (shard ${{ matrix.shard }}/4)
        run: |
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS_ONLY=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          cmake --build build-san --parallel
          ulimit -s 16384
          ./build-san/signal_test --quiet --no-soak --shard=${{ matrix.shard }}/4

  # UBSan + ASan: post-deploy verification on main only. UBSan catches
  # undefined behavior (signed overflow, strict-aliasing, null derefs,
  # OOB, etc.) that ASan alone misses; running them together backstops
  # the post-deploy check with maximum coverage. Same post-deploy gating
  # model as test-asan.
  test-ubsan:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 25
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v6
      - name: Build and run tests with UBSan + ASan
        run: |
          cmake -S . -B build-ubsan -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS_ONLY=ON \
            -DCMAKE_C_FLAGS="-O1 -g -fsanitize=undefined,address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined,address"
          cmake --build build-ubsan --parallel
          ulimit -s 16384
          ./build-ubsan/signal_test --quiet

  # signal_verify watchdog regression (#479 Layer E). Builds the
  # standalone tool and runs it against the committed chain-log
  # fixture; both exit code and JSON output must match the golden
  # baseline. The fixture is deterministic and tiny (<10 KB), so this
  # step is fast and stable. Sim changes that legitimately alter
  # event semantics must regenerate the fixture (see
  # tests/fixtures/README.md) — intentional friction.
  verify-chain-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Build signal_verify
        run: |
          cmake -S . -B build-verify -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS_ONLY=ON -DBUILD_TOOLS=ON
          cmake --build build-verify --target signal_verify --parallel
      - name: Verify fixture exit code
        run: |
          ./build-verify/signal_verify \
            tests/fixtures/3F5qRPtKg8GhGNnbd3qCj6nVJxWsGxq7pvH84okYLAqf.log
      - name: Compare JSON to golden
        run: |
          ./build-verify/signal_verify --report=json \
            tests/fixtures/3F5qRPtKg8GhGNnbd3qCj6nVJxWsGxq7pvH84okYLAqf.log \
            > /tmp/actual.json
          diff -u \
            tests/fixtures/3F5qRPtKg8GhGNnbd3qCj6nVJxWsGxq7pvH84okYLAqf.golden.json \
            /tmp/actual.json

  # Static analysis: parallel with tests.
  test-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install analysis tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck clang-tools clang-tidy

      - name: banned APIs
        run: make banned-apis

      - name: cppcheck
        run: make cppcheck

      - name: Clang static analyzer (scan-build)
        run: |
          cmake -S . -B build-scan -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS_ONLY=ON
          scan-build --status-bugs cmake --build build-scan

      - name: clang-tidy
        run: |
          cmake -S . -B build-tidy -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS_ONLY=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          clang-tidy -p build-tidy \
            server/game_sim.c server/sim_nav.c server/sim_autopilot.c \
            server/sim_ai.c server/sim_save.c server/sim_construction.c \
            2>&1 | tee clang-tidy-output.txt
          if grep -q "error:" clang-tidy-output.txt; then exit 1; fi

  # CRAP score (complexity * uncovered). Runs after deploy on main only:
  # useful as a regression report, too expensive/noisy for the local or PR
  # path, and not important enough to delay production promotion.
  test-crap:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install lizard + gcovr
        run: pip install --quiet lizard gcovr

      - name: Build signal_test with coverage
        run: |
          cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS_ONLY=ON \
            -DCMAKE_C_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build-coverage --target signal_test

      - name: Run tests (collect coverage)
        run: |
          ulimit -s 16384
          find build-coverage -name '*.gcda' -delete
          ./build-coverage/signal_test --quiet --no-soak

      - name: Generate gcovr JSON
        run: |
          gcovr -r . --json coverage.json --gcov-ignore-parse-errors \
            --filter 'server/.*' --filter 'client/.*' --filter 'shared/.*' \
            --exclude 'server/mongoose\..*' \
            --exclude 'client/stb_image\.h' \
            --exclude 'client/pl_mpeg\.h' \
            --exclude 'client/minimp3\.h' \
            build-coverage

      # Sim code + pure helpers are the files signal_test actually links,
      # so coverage is meaningful and CRAP is actionable. Threshold
      # 25 is structurally equivalent to "no function with CCN >= 25, and
      # CCN 10-24 functions need real test coverage" — the floor of the
      # CRAP formula is `+ ccn`, so CCN >= 25 cannot score below 25 at any
      # coverage level.
      - name: Compute CRAP (tested code) at threshold 25
        run: |
          python3 scripts/crap.py --coverage coverage.json \
            --paths server/game_sim.c server/sim_ai.c server/sim_autopilot.c \
                    server/sim_flight.c server/sim_nav.c server/sim_save.c \
                    server/sim_catalog.c server/sim_asteroid.c \
                    server/sim_physics.c server/sim_production.c \
                    server/sim_construction.c \
                    shared/commodity.c shared/manifest.c shared/ship.c \
                    shared/economy.c shared/asteroid.c shared/rng.c \
                    shared \
            --top 30 --threshold 25 --fail-on-exceed \
            --json-out crap-tested.json | tee crap-tested.txt

      # Client render/input/net + server entry point aren't linked into
      # signal_test. Coverage is always 0% here; treat as pure complexity.
      # Informational only — does not gate.
      - name: Complexity budget (untested code) — advisory
        if: always()
        run: |
          python3 scripts/crap.py --coverage coverage.json \
            --paths client/main.c client/hud.c client/input.c \
                    client/world_draw.c client/station_ui.c client/net.c \
                    client/net_sync.c client/audio.c client/client.h \
                    client/local_server.c \
                    server/main.c \
            --top 30 --threshold 30 \
            --json-out crap-client.json | tee crap-client.txt

      - name: Summarize in job summary
        if: always()
        run: |
          {
            echo "### CRAP — tested code (sim + helpers + shared)"
            echo ""
            echo 'Real CRAP: coverage is meaningful. Fix by lowering complexity _or_ raising coverage.'
            echo ''
            echo '```'
            cat crap-tested.txt
            echo '```'
            echo ""
            echo "### Complexity budget (client + server entry — not linked into signal_test)"
            echo ""
            echo 'Coverage always reads 0% here because signal_test does not link this code. Treat as a pure complexity report.'
            echo ''
            echo '```'
            cat crap-client.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CRAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crap-report
          path: |
            crap-tested.json
            crap-tested.txt
            crap-client.json
            crap-client.txt
            coverage.json

  # Client WASM build — parallel with tests. Runs on PRs as a browser-build
  # gate, and on main to produce the deploy artifact.
  build-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.8

      - name: Build WASM
        id: build_wasm
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          echo "git_hash=$GIT_HASH" >> "$GITHUB_OUTPUT"
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DGIT_HASH=$GIT_HASH
          cmake --build build-web

      - name: Prepare artifacts
        env:
          GIT_HASH: ${{ steps.build_wasm.outputs.git_hash }}
          SIGNAL_RELAY_BROKER_URL: ${{ vars.SIGNAL_RELAY_BROKER_URL }}
        run: |
          mkdir -p _site/play _site/music _site/ost _site/docs
          mkdir -p "_site/play/v/$GIT_HASH"
          cp web/index.html _site/index.html
          cp web/play.html _site/play/index.html
          cp web/signal-touch-controls.js _site/play/signal-touch-controls.js
          cp web/music.html _site/music/index.html
          cp web/music.html _site/ost/index.html
          cp build-web/signal.js _site/play/signal.js
          cp build-web/signal.wasm _site/play/signal.wasm
          # Version-pinned archive — bootstrap loads this when server
          # advertises an older hash, preventing wire-format desync.
          cp build-web/signal.js "_site/play/v/$GIT_HASH/signal.js"
          cp build-web/signal.wasm "_site/play/v/$GIT_HASH/signal.wasm"
          cp docs/*.svg _site/docs/ 2>/dev/null || true
          cp docs/*.png _site/docs/ 2>/dev/null || true
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("_site/play/index.html")
          html = path.read_text()
          broker = os.environ.get("SIGNAL_RELAY_BROKER_URL", "").strip()
          if broker:
              script = f"<script>window.SIGNAL_RELAY_BROKER={json.dumps(broker)};</script>"
          else:
              script = '<script>window.SIGNAL_SERVER="wss://signal-ws.ratimics.com/ws";</script>'
          path.write_text(html.replace("<head>", "<head>" + script, 1))
          PY

      - name: Upload client artifact
        uses: actions/upload-artifact@v7
        with:
          name: client-site
          path: _site/

  # Multiplayer latency smoke: exercises the browser client through the local
  # websocket latency proxy in both high-latency and low-ping/high-ack modes.
  # The regular browser smoke intentionally skips these cases unless a proxy is
  # already running; this job owns that orchestration so PRs cannot regress the
  # correction/ack telemetry path silently.
  test-latency-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.8

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libx11-dev libxi-dev libxcursor-dev libasound2-dev

      - name: Install test dependencies
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run latency smoke suite
        run: PATH="/usr/local/bin:/usr/bin:$PATH" make smoke-latency-suite

  # Server Docker build — gated on test-basic so we don't push a
  # broken image to ECR (real cost: ECR storage + ECS rollover risk).
  # Multi-arch QEMU build is the longest pole at ~5 min on its own.
  build-server:
    runs-on: ubuntu-latest
    needs: test-basic
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::022118847419:role/github-actions-deploy
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute short hash
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: 022118847419.dkr.ecr.us-east-1.amazonaws.com/signal-relay:${{ steps.vars.outputs.short_sha }}
          build-args: GIT_HASH=${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy gates on fast/soak/static/client/server work. Slower advisory
  # diagnostics such as CRAP and sanitizers run after promotion on main.
  deploy:
    runs-on: ubuntu-latest
    needs: [test-basic, test-soak, test-static, build-client, test-latency-smoke, build-server, native]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::022118847419:role/github-actions-deploy
          aws-region: us-east-1

      - name: Download client artifact
        uses: actions/download-artifact@v7
        with:
          name: client-site
          path: _site/

      # --- Snapshot current state for rollback ---
      - name: Snapshot current client
        id: snapshot-client
        continue-on-error: true
        run: |
          aws s3 sync s3://signal-ratimics-client/ /tmp/rollback-client/ --quiet
          echo "has_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Snapshot current server task definition
        id: snapshot-server
        run: |
          set -euo pipefail
          SERVICE_JSON=$(aws ecs describe-services \
            --cluster default \
            --services signal-relay \
            --output json)
          CURRENT_TASK_DEF=$(
            jq -r '
              .services[0].deployments
              | map(select(.rolloutState == "COMPLETED"))
              | .[0].taskDefinition // empty
            ' <<<"$SERVICE_JSON"
          )
          if [ -z "$CURRENT_TASK_DEF" ] || [ "$CURRENT_TASK_DEF" = "null" ]; then
            CURRENT_TASK_DEF=$(jq -r '.services[0].taskDefinition' <<<"$SERVICE_JSON")
          fi
          echo "task_def_arn=$CURRENT_TASK_DEF" >> "$GITHUB_OUTPUT"

      # --- Stage immutable client bundle first ---
      - name: Deploy versioned client bundle to S3
        run: |
          set -euo pipefail
          GIT_HASH=${{ needs.build-server.outputs.image_tag }}
          test -f "_site/play/v/$GIT_HASH/signal.js"
          test -f "_site/play/v/$GIT_HASH/signal.wasm"
          # Versioned bundles are additive and immutable; never delete prior
          # versions because rolled-back servers can still advertise them.
          aws s3 sync _site/play/v/ s3://signal-ratimics-client/play/v/

      - name: Invalidate versioned bundle
        run: |
          set -euo pipefail
          GIT_HASH=${{ needs.build-server.outputs.image_tag }}
          INV_ID=$(
            aws cloudfront create-invalidation \
              --distribution-id E32W3RMW5O86FJ \
              --paths "/play/v/$GIT_HASH/*" \
              --query 'Invalidation.Id' \
              --output text
          )
          echo "Submitted CloudFront invalidation $INV_ID for /play/v/$GIT_HASH/*"
          sleep 30

      - name: Deploy server to ECS
        id: deploy_server
        run: |
          set -euo pipefail
          IMAGE_REPO=022118847419.dkr.ecr.us-east-1.amazonaws.com/signal-relay
          IMAGE_TAG=${{ needs.build-server.outputs.image_tag }}
          ARM64_DIGEST=$(
            aws ecr batch-get-image \
              --repository-name signal-relay \
              --image-ids imageTag=$IMAGE_TAG \
              --accepted-media-types application/vnd.oci.image.index.v1+json \
              --query 'images[0].imageManifest' \
              --output text |
            jq -r '.manifests[] | select(.platform.architecture == "arm64" and .platform.os == "linux") | .digest'
          )
          TARGET_IMAGE="${IMAGE_REPO}@${ARM64_DIGEST}"
          CURRENT_TASK_DEF="${{ steps.snapshot-server.outputs.task_def_arn }}"
          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEF" \
            --query 'taskDefinition' > taskdef.json
          CURRENT_IMAGE=$(jq -r '.containerDefinitions[0].image' taskdef.json)
          SERVICE_JSON=$(aws ecs describe-services \
            --cluster default \
            --services signal-relay \
            --output json)
          DEPLOYMENT_COUNT=$(jq -r '.services[0].deployments | length' <<<"$SERVICE_JSON")
          CURRENT_SERVICE_TASK_DEF=$(jq -r '.services[0].taskDefinition' <<<"$SERVICE_JSON")
          if [ "$CURRENT_IMAGE" = "$TARGET_IMAGE" ]; then
            if [ "$DEPLOYMENT_COUNT" = "1" ] && [ "$CURRENT_SERVICE_TASK_DEF" = "$CURRENT_TASK_DEF" ]; then
              echo "Server already uses $TARGET_IMAGE and ECS is on the stable task definition; skipping ECS update."
              echo "updated=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Server image is already $TARGET_IMAGE, but ECS has an in-progress deployment; returning to stable task definition $CURRENT_TASK_DEF."
            aws ecs update-service \
              --cluster default \
              --service signal-relay \
              --health-check-grace-period-seconds 180 \
              --deployment-configuration 'maximumPercent=200,minimumHealthyPercent=100,deploymentCircuitBreaker={enable=true,rollback=true}' \
              --task-definition "$CURRENT_TASK_DEF"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "task_def_arn=$CURRENT_TASK_DEF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq --arg image "$TARGET_IMAGE" '
            def upsert_env($name; $value):
              .containerDefinitions[0].environment =
                ((.containerDefinitions[0].environment // [])
                 | map(select(.name != $name))
                 + [{"name": $name, "value": $value}]);
            .containerDefinitions[0].image = $image |
            upsert_env("SIGNAL_PERSISTENCE_MODE"; "external_s3") |
            upsert_env("SIGNAL_DATA_DIR"; "/app/data") |
            upsert_env("SIGNAL_STATE_S3_URI"; "s3://signal-ratimics-state/prod/") |
            upsert_env("SIGNAL_STATE_SYNC_INTERVAL_SEC"; "60") |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
          ' taskdef.json > taskdef-deploy.json
          TASK_DEF_ARN=$(
            aws ecs register-task-definition \
              --cli-input-json file://taskdef-deploy.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )
          aws ecs update-service \
            --cluster default \
            --service signal-relay \
            --health-check-grace-period-seconds 180 \
            --deployment-configuration 'maximumPercent=200,minimumHealthyPercent=100,deploymentCircuitBreaker={enable=true,rollback=true}' \
            --task-definition "$TASK_DEF_ARN"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "task_def_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Wait for ECS stabilization
        id: ecs_stabilization
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "Waiting for new server task to be running..."
          for attempt in $(seq 1 100); do
            SERVICE_JSON=$(aws ecs describe-services \
              --cluster default \
              --services signal-relay \
              --output json)
            jq -r '
              .services[0] as $svc |
              "attempt '"$attempt"': desired=\($svc.desiredCount) running=\($svc.runningCount) pending=\($svc.pendingCount) deployments=\($svc.deployments | length)",
              ($svc.deployments[] |
                "  \(.status) \(.rolloutState // "UNKNOWN") desired=\(.desiredCount) running=\(.runningCount) pending=\(.pendingCount) failed=\(.failedTasks // 0) \(.taskDefinition)")
            ' <<<"$SERVICE_JSON"
            if jq -e '
              .services[0] as $svc |
              ($svc.deployments | length == 1) and
              ($svc.deployments[0].rolloutState == "COMPLETED" or ($svc.deployments[0].rolloutState // "") == "") and
              ($svc.runningCount == $svc.desiredCount) and
              ($svc.pendingCount == 0)
            ' <<<"$SERVICE_JSON" >/dev/null; then
              echo "ECS service is stable."
              exit 0
            fi
            if jq -e '.services[0].deployments[] | select((.rolloutState // "") == "FAILED")' <<<"$SERVICE_JSON" >/dev/null; then
              echo "::error::ECS deployment entered FAILED rollout state"
              exit 1
            fi
            sleep 15
          done
          aws ecs describe-services \
            --cluster default \
            --services signal-relay \
            --query 'services[0].events[0:10].message' \
            --output text
          echo "::error::ECS service did not stabilize within 25 minutes"
          exit 1

      - name: Rollback server after stabilization failure
        if: steps.ecs_stabilization.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::error::ECS stabilization failed — rolling back server to previous stable task definition"
          aws ecs update-service \
            --cluster default \
            --service signal-relay \
            --health-check-grace-period-seconds 180 \
            --deployment-configuration 'maximumPercent=200,minimumHealthyPercent=100,deploymentCircuitBreaker={enable=true,rollback=true}' \
            --task-definition "${{ steps.snapshot-server.outputs.task_def_arn }}"
          for attempt in $(seq 1 80); do
            SERVICE_JSON=$(aws ecs describe-services \
              --cluster default \
              --services signal-relay \
              --output json)
            jq -r '
              .services[0] as $svc |
              "rollback attempt '"$attempt"': desired=\($svc.desiredCount) running=\($svc.runningCount) pending=\($svc.pendingCount) deployments=\($svc.deployments | length)",
              ($svc.deployments[] |
                "  \(.status) \(.rolloutState // "UNKNOWN") desired=\(.desiredCount) running=\(.runningCount) pending=\(.pendingCount) failed=\(.failedTasks // 0) \(.taskDefinition)")
            ' <<<"$SERVICE_JSON"
            if jq -e '
              .services[0] as $svc |
              ($svc.deployments | length == 1) and
              ($svc.runningCount == $svc.desiredCount) and
              ($svc.pendingCount == 0)
            ' <<<"$SERVICE_JSON" >/dev/null; then
              echo "Rollback service is stable."
              exit 1
            fi
            sleep 15
          done
          echo "::error::Rollback did not stabilize within 20 minutes"
          exit 1

      # --- Smoke test staged server against the already-published pinned bundle ---
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install test dependencies
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Smoke test before root client promotion
        id: smoke-pre-promote
        continue-on-error: true
        run: SIGNAL_PRE_PROMOTION_SMOKE=1 SMOKE_URL=https://signal.ratimics.com/play/ npx playwright test

      - name: Upload pre-promotion smoke results
        if: steps.smoke-pre-promote.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-pre-promote
          path: test-results/

      - name: Rollback server
        if: steps.smoke-pre-promote.outcome == 'failure'
        run: |
          echo "::error::Smoke tests failed — rolling back server to previous task definition"
          aws ecs update-service \
            --cluster default \
            --service signal-relay \
            --health-check-grace-period-seconds 180 \
            --deployment-configuration 'maximumPercent=200,minimumHealthyPercent=100,deploymentCircuitBreaker={enable=true,rollback=true}' \
            --task-definition "${{ steps.snapshot-server.outputs.task_def_arn }}"
          aws ecs wait services-stable --cluster default --services signal-relay

      - name: Fail if pre-promotion smoke tests failed
        if: steps.smoke-pre-promote.outcome == 'failure'
        run: exit 1

      # --- Promote root client only after the new server proves coherent ---
      - name: Promote root client to S3
        run: |
          set -euo pipefail
          # Root assets: --delete strips anything removed from _site/ —
          # but we exclude the versioned archive so old pinned bundles
          # stay reachable when the server is still on their hash.
          aws s3 sync _site/ s3://signal-ratimics-client/ --delete --exclude "play/v/*"

      - name: Invalidate promoted root client
        run: |
          set -euo pipefail
          INV_ID=$(
            aws cloudfront create-invalidation \
              --distribution-id E32W3RMW5O86FJ \
              --paths "/*" \
              --query 'Invalidation.Id' \
              --output text
          )
          echo "Submitted CloudFront invalidation $INV_ID for root client"
          sleep 30

      - name: Smoke test after root client promotion
        id: smoke-post-promote
        continue-on-error: true
        run: SMOKE_URL=https://signal.ratimics.com/play/ npx playwright test

      - name: Upload post-promotion smoke results
        if: steps.smoke-post-promote.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-post-promote
          path: test-results/

      - name: Rollback promoted root client
        if: steps.smoke-post-promote.outcome == 'failure' && steps.snapshot-client.outputs.has_snapshot == 'true'
        run: |
          echo "::error::Post-promotion smoke tests failed — rolling back root client"
          aws s3 sync /tmp/rollback-client/ s3://signal-ratimics-client/ --delete --exclude "play/v/*"
          INV_ID=$(
            aws cloudfront create-invalidation \
              --distribution-id E32W3RMW5O86FJ \
              --paths "/*" \
              --query 'Invalidation.Id' \
              --output text
          )
          echo "Submitted CloudFront rollback invalidation $INV_ID"
          sleep 30

      - name: Fail if post-promotion smoke tests failed
        if: steps.smoke-post-promote.outcome == 'failure'
        run: exit 1

  # Native builds: only after basic tests pass. fail-fast cancels
  # the whole matrix the moment any platform breaks.
  native:
    needs: test-basic
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-15
            name: macos
          - os: windows-2025-vs2026
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libx11-dev libxi-dev libxcursor-dev libasound2-dev

      - name: Build
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGIT_HASH=$GIT_HASH
          cmake --build build --config Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: signal-${{ matrix.name }}
          path: build/
