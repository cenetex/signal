name: Native Safety Gates

on:
  pull_request:
    paths:
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'tests/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build cppcheck libasound2-dev libx11-dev libxi-dev libxcursor-dev libgl-dev
      - name: Run test and policy gates
        run: |
          make build-server
          make test
          make test-san
          make banned-apis deterministic-libm doc-freshness
          make cppcheck

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install fuzz toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang
      # Replays the tracked seed corpus (deterministic regression gate for
      # the receipt/handoff decode paths), then explores for FUZZ_TIME
      # seconds. A crash fails the job and its artifact is uploaded below.
      - name: Fuzz receipt/handoff decode paths
        run: make fuzz-receipts FUZZ_TIME=300
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-cargo-receipt-artifacts
          path: tests/fuzz/artifacts/
          if-no-files-found: ignore
