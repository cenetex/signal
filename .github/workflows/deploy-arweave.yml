name: Deploy to Arweave + Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'tools/**'
      - 'scripts/**'
      - 'workers/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'wrangler.toml'
      - '.github/workflows/deploy-arweave.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libxcursor-dev libgl-dev

      - name: Run fast C suite
        run: |
          make banned-apis
          make deterministic-libm
          make test
          make replay-repeatability
          make replay-cross-build

  test-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run ASan/UBSan suite
        run: make test-san

  smoke-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libxcursor-dev libgl-dev

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run native/WASM replay determinism gate
        run: |
          export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
          make replay-native-wasm
          make replay-native-wasm-long

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke
        run: |
          export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
          make smoke

  deploy:
    runs-on: ubuntu-latest
    needs: [test-fast, smoke-browser]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libxcursor-dev libgl-dev

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build WASM client
        run: |
          export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
          make build-web

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp build-web/signal.html build-web/signal.js build-web/signal.wasm \
             build-web/play.html build-web/signal-touch-controls.js \
             build-web/signal-hail-llm.js build-web/signal-hail-gguf-worker.js \
             build-web/signal-hail-wllama-runtime.js _site/
          cp web/index.html web/mine.html web/ost.html web/shell.html _site/

      - name: Deploy Cloudflare Worker
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Deploy via Irys (Arweave)
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}
        run: node scripts/deploy-arweave.mjs

      - name: Update Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler kv key put --remote --binding SIGNAL_MANIFEST manifest "$(cat .arweave-paths.json)"
