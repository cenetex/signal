name: Deploy Fly App

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'vendor/**'
      - 'web/**'
      - 'CMakeLists.txt'
      - '.dockerignore'
      - 'fly.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'server/Dockerfile'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch:
    inputs:
      launch:
        description: 'Create the Fly app and volume before deploying'
        required: false
        type: boolean
        default: false
      deploy:
        description: 'Deploy after launch/setup'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fly-app-${{ github.ref }}
  cancel-in-progress: false

env:
  FLY_APP: ${{ vars.FLY_APP || 'signal-relay' }}
  FLY_REGION: ${{ vars.FLY_REGION || 'lax' }}
  FLY_VOLUME: ${{ vars.FLY_VOLUME || 'signal_data' }}
  FLY_VOLUME_SIZE: ${{ vars.FLY_VOLUME_SIZE || '1' }}
  FLY_ORG: ${{ vars.FLY_ORG || '' }}
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  SIGNAL_STATION_AUTH_SECRET: ${{ secrets.SIGNAL_STATION_AUTH_SECRET }}

jobs:
  deploy:
    name: Launch or deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: ${{ vars.FLYCTL_VERSION || '0.4.59' }}

      - name: Validate Fly config
        run: flyctl config validate --config fly.toml

      - name: Launch Fly app
        if: github.event_name == 'workflow_dispatch' && inputs.launch == true
        shell: bash
        run: |
          set -euo pipefail
          if flyctl apps list --quiet | grep -Fx "$FLY_APP" >/dev/null; then
            echo "Fly app $FLY_APP already exists"
            exit 0
          fi

          args=(
            launch
            --copy-config
            --no-deploy
            --no-github-workflow
            --name "$FLY_APP"
            --region "$FLY_REGION"
            --config fly.toml
          )
          if [ -n "$FLY_ORG" ]; then
            args+=(--org "$FLY_ORG")
          fi
          flyctl "${args[@]}"

      - name: Ensure Fly volume
        if: github.event_name == 'workflow_dispatch' && inputs.launch == true
        shell: bash
        run: |
          set -euo pipefail
          if flyctl volumes list --app "$FLY_APP" --json | \
             node -e '
               const fs = require("fs");
               const vols = JSON.parse(fs.readFileSync(0, "utf8"));
               const found = Array.isArray(vols) && vols.some((v) =>
                 v.name === process.env.FLY_VOLUME &&
                 (!process.env.FLY_REGION || v.region === process.env.FLY_REGION)
               );
               process.exit(found ? 0 : 1);
             '; then
            echo "Fly volume $FLY_VOLUME already exists in $FLY_REGION"
            exit 0
          fi

          flyctl volumes create "$FLY_VOLUME" \
            --app "$FLY_APP" \
            --region "$FLY_REGION" \
            --size "$FLY_VOLUME_SIZE" \
            --yes

      - name: Stage station authority secret
        if: github.event_name == 'workflow_dispatch' && inputs.launch == true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SIGNAL_STATION_AUTH_SECRET" ]; then
            echo "::warning::SIGNAL_STATION_AUTH_SECRET is not set; relay will use its development station authority secret"
            exit 0
          fi
          flyctl secrets set \
            --app "$FLY_APP" \
            --stage \
            SIGNAL_STATION_AUTH_SECRET="$SIGNAL_STATION_AUTH_SECRET"

      - name: Deploy Fly app
        if: github.event_name != 'workflow_dispatch' || inputs.deploy == true
        shell: bash
        run: |
          set -euo pipefail
          flyctl deploy \
            --remote-only \
            --config fly.toml \
            --app "$FLY_APP" \
            --build-arg "GIT_HASH=${GITHUB_SHA::7}"

      - name: Check Fly health
        if: github.event_name != 'workflow_dispatch' || inputs.deploy == true
        run: |
          curl --retry 8 --retry-all-errors --retry-delay 2 \
            --fail --show-error --silent \
            "https://${FLY_APP}.fly.dev/health"
