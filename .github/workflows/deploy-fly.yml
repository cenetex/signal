name: Deploy Fly App

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'vendor/**'
      - 'web/**'
      - 'assets/**'
      - 'scripts/webrtc-gateway.mjs'
      - 'scripts/fly-shop-chain.mjs'
      - 'scripts/fly-shop-service.mjs'
      - 'scripts/fly-shop-store.mjs'
      - 'scripts/solana-ship-burn.mjs'
      - 'scripts/fly-webrtc-entrypoint.sh'
      - 'scripts/lightsail-webrtc-entrypoint.sh'
      - 'CMakeLists.txt'
      - 'Makefile'
      - '.dockerignore'
      - 'fly.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'server/Dockerfile'
      - '.github/workflows/deploy-fly.yml'
      - 'tests/post-deploy-play.live.ts'
      - 'tests/post-deploy-play.config.ts'
  workflow_dispatch:
    inputs:
      launch:
        description: 'Create the Fly app and volume before deploying'
        required: false
        type: boolean
        default: false
      deploy:
        description: 'Deploy after launch/setup'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fly-app-${{ github.ref }}
  cancel-in-progress: false

env:
  FLY_APP: ${{ vars.FLY_APP || 'signal-relay-kind-pond-4338' }}
  FLY_REGION: ${{ vars.FLY_REGION || 'lax' }}
  FLY_VOLUME: ${{ vars.FLY_VOLUME || 'signal_data' }}
  FLY_VOLUME_SIZE: ${{ vars.FLY_VOLUME_SIZE || '1' }}
  FLY_ORG: ${{ vars.FLY_ORG || '' }}
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  SIGNAL_STATION_AUTH_SECRET: ${{ secrets.SIGNAL_STATION_AUTH_SECRET }}
  SIGNAL_ASSET_PACK_URL: ${{ vars.SIGNAL_ASSET_PACK_URL }}
  SIGNAL_ASSET_PACK_SHA256: ${{ vars.SIGNAL_ASSET_PACK_SHA256 }}

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Provision verified media before candidate checks
        run: python3 scripts/assets.py sync
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build cppcheck libasound2-dev libx11-dev libxi-dev libxcursor-dev libgl-dev libssl-dev
      - name: Run safety gates
        run: |
          make build-server
          make test
          make test-soak
          make test-san
          make cargo-trust-audit banned-apis deterministic-libm doc-freshness soak-automation vendor-drift
          make cppcheck
      - name: Build browser client
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GIT_HASH="${GITHUB_SHA::7}" \
            emscripten/emsdk:4.0.15 \
            bash -lc 'emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DGIT_HASH="$GIT_HASH" && emmake cmake --build build-web --parallel'
          python3 scripts/check_client_memory_budget.py build-web/signal.wasm
      - name: Run browser smoke
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
          npm run smoke
      - name: Upload perception review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perception-review-${{ github.sha }}
          path: |
            test-results/**/perception-*.png
            !test-results/**/attachments/**
          if-no-files-found: warn

  deploy:
    name: Launch or deploy app
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: ${{ vars.FLYCTL_VERSION || '0.4.59' }}

      - name: Provision verified media before the container build
        run: python3 scripts/assets.py sync

      - name: Validate Fly config
        run: flyctl config validate --config fly.toml

      - name: Launch Fly app
        if: github.event_name == 'workflow_dispatch' && inputs.launch == true
        shell: bash
        run: |
          set -euo pipefail
          if flyctl apps list --quiet | grep -Fx "$FLY_APP" >/dev/null; then
            echo "Fly app $FLY_APP already exists"
            exit 0
          fi

          args=(
            launch
            --copy-config
            --no-deploy
            --no-github-workflow
            --name "$FLY_APP"
            --region "$FLY_REGION"
            --config fly.toml
          )
          if [ -n "$FLY_ORG" ]; then
            args+=(--org "$FLY_ORG")
          fi
          flyctl "${args[@]}"

      - name: Ensure Fly volume
        if: github.event_name == 'workflow_dispatch' && inputs.launch == true
        shell: bash
        run: |
          set -euo pipefail
          if flyctl volumes list --app "$FLY_APP" --json | \
             node -e '
               const fs = require("fs");
               const vols = JSON.parse(fs.readFileSync(0, "utf8"));
               const found = Array.isArray(vols) && vols.some((v) =>
                 v.name === process.env.FLY_VOLUME &&
                 (!process.env.FLY_REGION || v.region === process.env.FLY_REGION)
               );
               process.exit(found ? 0 : 1);
             '; then
            echo "Fly volume $FLY_VOLUME already exists in $FLY_REGION"
            exit 0
          fi

          flyctl volumes create "$FLY_VOLUME" \
            --app "$FLY_APP" \
            --region "$FLY_REGION" \
            --size "$FLY_VOLUME_SIZE" \
            --yes

      - name: Stage station authority secret
        if: github.event_name != 'workflow_dispatch' || inputs.launch == true || inputs.deploy == true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SIGNAL_STATION_AUTH_SECRET" ]; then
            echo "::error::SIGNAL_STATION_AUTH_SECRET is required for deployment"
            exit 1
          fi
          flyctl secrets set \
            --app "$FLY_APP" \
            --stage \
            SIGNAL_STATION_AUTH_SECRET="$SIGNAL_STATION_AUTH_SECRET"

      - name: Deploy Fly app
        if: github.event_name != 'workflow_dispatch' || inputs.deploy == true
        shell: bash
        run: |
          set -euo pipefail
          flyctl deploy \
            --remote-only \
            --config fly.toml \
            --app "$FLY_APP" \
            --build-arg "GIT_HASH=${GITHUB_SHA::7}"

      - name: Check Fly health
        if: github.event_name != 'workflow_dispatch' || inputs.deploy == true
        run: |
          curl --retry 8 --retry-all-errors --retry-delay 2 \
            --fail --show-error --silent \
            "https://${FLY_APP}.fly.dev/health"

  play-check:
    name: Verify deployed desktop and touch play
    needs: deploy
    if: github.event_name != 'workflow_dispatch' || inputs.deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser check dependencies
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
      - name: Check deployed revision and play
        env:
          SIGNAL_PLAY_URL: https://${{ env.FLY_APP }}.fly.dev/play.html
          SIGNAL_EXPECTED_REVISION: ${{ github.sha }}
        run: npx --no-install playwright test --config tests/post-deploy-play.config.ts
      - name: Upload deployed play evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-play-${{ github.sha }}
          path: |
            test-results/post-deploy-play/
            playwright-report/post-deploy-play/
          retention-days: 7
          if-no-files-found: warn
      - name: Record play verification result
        if: always()
        env:
          PLAY_STATUS: ${{ job.status }}
        run: |
          echo "### Deployed play verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment completed in the deploy job. Desktop and touch play checks: $PLAY_STATUS." >> "$GITHUB_STEP_SUMMARY"
          echo "Evidence: deployed-play-${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
