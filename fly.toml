# Fly app names are globally unique. Change this before the first deploy if
# Fly asks for a different name, then keep the volume name below unchanged.
app = "signal-relay-kind-pond-4338"
primary_region = "lax"

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "8080"
  SIGNAL_DATA_DIR = "/app/data"
  SIGNAL_STATIC_DIR = "/app/public"
  SIGNAL_ALLOWED_ORIGIN = "https://signal.ratimics.com"

[mounts]
  source = "signal_data"
  destination = "/app/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 32
    hard_limit = 64

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "3s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
