# Fly app names are globally unique. Change this before the first deploy if
# Fly asks for a different name, then keep the volume name below unchanged.
app = "signal-relay-kind-pond-4338"
primary_region = "lax"

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "8080"
  SIGNAL_SERVER_PORT = "9091"
  SIGNAL_DATA_DIR = "/app/data"
  SIGNAL_STATIC_DIR = "/app/public"
  SIGNAL_ALLOWED_ORIGIN = "https://signal.ratimics.com"
  SIGNAL_REQUIRE_STATION_AUTH_SECRET = "1"
  SIGNAL_TRUST_PROXY_HEADERS = "1"
  RTC_GATEWAY_PREFIX = "/rtc"
  RTC_GATEWAY_ICE_BIND = "fly-global-services"
  RTC_GATEWAY_ICE_PORT = "50000"
  RTC_GATEWAY_ICE_UDP_MUX = "1"

[mounts]
  source = "signal_data"
  destination = "/app/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 32
    hard_limit = 64

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "3s"
    path = "/health"

[[services]]
  protocol = "udp"
  internal_port = 50000

  [[services.ports]]
    port = 50000

[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory = "2gb"
