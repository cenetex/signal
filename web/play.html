<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta http-equiv="Permissions-Policy" content="cross-origin-isolated=(self)">
    <title>Signal — Play</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap");

      :root {
        color-scheme: dark;
        --bg: #080706;
        --panel: rgba(10, 10, 9, 0.84);
        --line: rgba(245, 239, 223, 0.14);
        --ink: #f5efdf;
        --muted: #cfc3ad;
        --signal: #80ffd5;
        --ore: #f1b566;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background:
          radial-gradient(circle at 16% 18%, rgba(241, 181, 102, 0.08), transparent 26%),
          radial-gradient(circle at 86% 76%, rgba(128, 255, 213, 0.08), transparent 24%),
          var(--bg);
        -webkit-user-select: none;
        user-select: none;
      }

      body {
        color: var(--ink);
        font-family: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--signal);
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: var(--bg);
        transition: opacity 0.4s;
      }

      #loading.done {
        opacity: 0;
        pointer-events: none;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="loading">Linking signal chain...</div>


    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    <script>
      var canvas = document.getElementById('canvas');
      var signalBundleVersion = String(Date.now());
      var signalWasmReady = false;

      function signalVersionedAsset(path) {
        var join = path.indexOf('?') === -1 ? '?' : '&';
        return path + join + 'v=' + encodeURIComponent(signalBundleVersion);
      }

      var Module = {
        canvas: canvas,
        locateFile: function(path, prefix) {
          if (path === 'signal.wasm') {
            return signalVersionedAsset((prefix || '') + path);
          }
          return (prefix || '') + path;
        },
        print: function(text) { console.log(text); },
        printErr: function(text) {
          var line = String(text || '');
          if (/^\[net-action\].*status=(ok|duplicate)\b/.test(line) ||
              /^LAUNCH:/.test(line)) {
            console.log(line);
          } else if (/^(music|episode): .*not found locally/.test(line) ||
                     /^episode: fetch failed/.test(line)) {
            console.warn(line);
          } else {
            console.error(line);
          }
        },
        onRuntimeInitialized: function() {
          signalWasmReady = true;
          window.SignalGameWasmReady = true;
          document.getElementById('loading').classList.add('done');
          var smokeParams = new URLSearchParams(window.location.search);
          var smokeState = Number(smokeParams.get('smokeState'));
          if (smokeParams.get('smoke') === '1' &&
              Number.isInteger(smokeState) && smokeState > 0 &&
              typeof Module.ccall === 'function') {
            var applySmokeState = function() {
              return Module.ccall(
                'set_smoke_loop_state', 'number', ['number'], [smokeState]);
            };
            var beginSmokeState = function() {
              /* onRuntimeInitialized runs before main() has finished seeding
               * the single-player world. Wait for the fixture to accept the
               * state before pinning it; applying into the zeroed pre-main
               * world produces a blank visual-QA frame. */
              if (applySmokeState() !== 1) {
                window.setTimeout(beginSmokeState, 16);
                return;
              }
              /* The loopback server keeps publishing authoritative state. A
               * fixture selected in the URL must be re-applied after those
               * packets so visual QA sees a stable scene rather than one frame. */
              window.setInterval(applySmokeState, 16);
            };
            /* Let main() and the first loopback snapshot finish before a
             * fixture is allowed to freeze local publication. */
            window.setTimeout(beginSmokeState, 250);
          }
          signalFocusCanvas();
        }
      };

      window.SignalGameModule = Module;
      window.SignalGameWasmReady = false;

      function signalWasmCall(name, returnType, argTypes, args) {
        try {
          var m = window.SignalGameModule || window.Module;
          if (m && typeof m['_' + name] === 'function') {
            return m['_' + name].apply(m, args || []);
          }
          if (!signalWasmReady && !window.SignalGameWasmReady) {
            return null;
          }
          if (m && typeof m.ccall === 'function') {
            return m.ccall(name, returnType || null, argTypes || [], args || []);
          }
        } catch (err) {
          if (!/func is not a function|unknown function|missing function/i.test(String(err && err.message || err))) {
            console.warn('[input] wasm call failed: ' + name, err);
          }
        }
        return null;
      }

      function signalClearHeldControls() {
        signalWasmCall('signal_mobile_clear', null, [], []);
      }

      function signalFocusCanvas() {
        if (document.hidden || !document.hasFocus()) return;
        if (document.activeElement === canvas) return;
        try { canvas.focus({ preventScroll: true }); }
        catch (_) { canvas.focus(); }
      }

      var signalKeyActions = {
        KeyW: 1, ArrowUp: 1,
        KeyS: 2, ArrowDown: 2,
        KeyA: 3, ArrowLeft: 3,
        KeyD: 4, ArrowRight: 4,
        KeyM: 5,
        Space: 6,
        KeyE: 7,
        KeyH: 8,
        ShiftLeft: 9, ShiftRight: 9,
        KeyB: 10,
        KeyR: 11,
        Tab: 12,
        KeyF: 13,
        KeyC: 15,
        KeyT: 16,
        Digit1: 20,
        Digit2: 21,
        Digit3: 22,
        Digit4: 23,
        Digit5: 24,
        KeyO: 30,
        Escape: 31
      };

      function signalKeyboardTargetIsGame(e) {
        var target = e.target || document.activeElement;
        if (target === canvas || target === document.body ||
            target === document.documentElement || target === window) return true;
        if (!target || !target.tagName) return true;
        var tag = target.tagName.toLowerCase();
        return tag !== 'input' && tag !== 'textarea' && tag !== 'select' &&
          !target.isContentEditable;
      }

      function signalFocusInsideTouchControls(target) {
        return !!(target && target.closest &&
          target.closest('.signal-touch-controls'));
      }

      function signalTouchControlHeld() {
        return !!document.querySelector('.signal-touch-button.is-held');
      }

      function signalKeyboardFallback(e, down) {
        if (!signalKeyboardTargetIsGame(e)) return;
        var action = signalKeyActions[e.code] || signalKeyActions[e.key];
        if (!action) return;
        signalFocusCanvas();
        signalWasmCall('signal_mobile_key', null, ['number', 'number'], [action, down ? 1 : 0]);
      }

      window.signalInputStatus = function() {
        var active = document.activeElement;
        return {
          activeElement: active ? (active.id || active.tagName || String(active)) : null,
          canvasFocused: document.activeElement === canvas,
          documentHidden: document.hidden,
          documentHasFocus: document.hasFocus(),
          heldMask: signalWasmCall('signal_debug_held_control_mask', 'number', [], []) || 0
        };
      };

      window.addEventListener('keydown', function(e) {
        signalKeyboardFallback(e, true);
      }, true);

      window.addEventListener('keyup', function(e) {
        signalKeyboardFallback(e, false);
      }, true);

      window.addEventListener('focus', signalFocusCanvas);
      window.addEventListener('pageshow', signalFocusCanvas);
      document.addEventListener('pointerdown', function(e) {
        if (e.target === canvas || e.target === document.body) signalFocusCanvas();
      }, true);

      window.addEventListener('blur', signalClearHeldControls);
      window.addEventListener('pagehide', signalClearHeldControls);
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) signalClearHeldControls();
        else signalFocusCanvas();
      });
      canvas.addEventListener('blur', function(e) {
        if (signalFocusInsideTouchControls(e.relatedTarget) ||
            signalTouchControlHeld()) return;
        signalClearHeldControls();
      });
    </script>
    <script>

      /* ?singleplayer=1 forces the in-process server.
       * ?server=ws://... or ?server=rtcs://... connects to an explicit relay.
       * ?online=1 connects to the same-origin WebSocket relay. Add
       * ?transport=rtc to opt into the WebRTC gateway.
       * Default is local-first singleplayer; ?lobby=wss://... lets a lobby
       * promote the page into a network session when a second player arrives. */
      var signalParams = new URLSearchParams(window.location.search);
      if (!window.SIGNAL_LOBBY_URL && window.location.hostname === 'signal.ratimics.com') {
        window.SIGNAL_LOBBY_URL = 'wss://jldrsi17o0.execute-api.us-west-2.amazonaws.com/prod';
      }

      if (signalParams.has('singleplayer')) window.SIGNAL_SERVER = '';
      else if (signalParams.has('server')) window.SIGNAL_SERVER = signalParams.get('server');
      else if (signalParams.has('online') || signalParams.has('multiplayer') || signalParams.has('network')) {
        var signalTransport = (signalParams.get('transport') || 'ws').toLowerCase();
        if (signalTransport === 'rtc' || signalTransport === 'webrtc') {
          var signalRtcProto = window.location.protocol === 'https:' ? 'rtcs:' : 'rtc:';
          window.SIGNAL_SERVER = signalRtcProto + '//' + window.location.host + '/rtc/signal-main';
        } else {
          var signalWsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          window.SIGNAL_SERVER = signalWsProto + '//' + window.location.host + '/ws';
        }
      }
      else {
        window.SIGNAL_SERVER = '';
      }

      function setLoading(message) {
        document.getElementById('loading').textContent = message;
      }

      function signalLobbyEndpoint(raw) {
        if (!raw || raw === '0' || raw === 'false') return '';
        if (raw === '1' || raw === 'true') raw = '/lobby';
        if (raw[0] === '/') {
          return (window.location.protocol === 'https:' ? 'wss://' : 'ws://') +
            window.location.host + raw;
        }
        if (raw.indexOf('https://') === 0) return 'wss://' + raw.slice('https://'.length);
        if (raw.indexOf('http://') === 0) return 'ws://' + raw.slice('http://'.length);
        return raw;
      }

      function signalPreferredOnlineServer(raw) {
        if (!raw) return raw;
        var transport = (signalParams.get('transport') || 'ws').toLowerCase();
        if (transport === 'rtc' || transport === 'webrtc') return raw;
        if (raw.indexOf('rtcs://') !== 0 && raw.indexOf('rtc://') !== 0 &&
            raw.indexOf('webrtc+wss://') !== 0 &&
            raw.indexOf('webrtc+ws://') !== 0) {
          return raw;
        }
        try {
          var websocketRaw = raw
            .replace(/^rtcs:/, 'wss:')
            .replace(/^rtc:/, 'ws:')
            .replace(/^webrtc\+wss:/, 'wss:')
            .replace(/^webrtc\+ws:/, 'ws:');
          var serverUrl = new URL(websocketRaw);
          serverUrl.pathname = '/ws';
          serverUrl.search = '';
          serverUrl.hash = '';
          return serverUrl.toString();
        } catch (_) {
          return raw;
        }
      }

      function signalStablePeerId() {
        try {
          var key = 'signal_node_id';
          var id = localStorage.getItem(key);
          if (!id) {
            id = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() :
              Math.random().toString(16).slice(2) + Date.now().toString(16);
            localStorage.setItem(key, id);
          }
          return id;
        } catch (_) {
          return Math.random().toString(16).slice(2);
        }
      }

      function signalStartLobby() {
        /* Explicit authority selections are already connected by the game
         * client. Starting lobby matchmaking as well can receive serverReady
         * and replace the page while WASM is still initializing. */
        if (signalParams.has('server') || signalParams.has('singleplayer') ||
            signalParams.has('online') || signalParams.has('multiplayer') ||
            signalParams.has('network')) return;
        var lobby = signalLobbyEndpoint(signalParams.get('lobby') || window.SIGNAL_LOBBY_URL || '');
        if (!lobby) return;
        var room = signalParams.get('room') || 'signal-main';
        var ws;
        try {
          ws = new WebSocket(lobby);
        } catch (_) {
          return;
        }
        ws.addEventListener('open', function() {
          ws.send(JSON.stringify({
            action: 'join',
            room: room,
            peer: signalStablePeerId(),
            build: (window.SIGNAL_BUILD || ''),
            href: window.location.href
          }));
        });
        ws.addEventListener('message', function(ev) {
          var msg;
          try { msg = JSON.parse(ev.data); } catch (_) { return; }
          if (msg.type !== 'serverReady' && msg.type !== 'server-ready') return;
          var server = signalPreferredOnlineServer(
            msg.server || msg.rtcUrl || msg.url);
          if (!server) return;
          var u = new URL(window.location.href);
          u.searchParams.set('server', server);
          u.searchParams.set('network', '1');
          u.searchParams.delete('singleplayer');
          u.searchParams.delete('lobby');
          setLoading('Network session ready...');
          window.location.replace(u.pathname + '?' + u.searchParams.toString() + u.hash);
        });
      }

      signalStartLobby();

      canvas.addEventListener('pointerdown', function() {
        signalFocusCanvas();
      });

      /* Prevent browser from stealing game keys. Tab is a docked-UI key
       * now (tab strip cycling) so we must preventDefault on it too;
       * otherwise focus escapes the canvas on the first Tab press. */
      window.addEventListener('keydown', function(e) {
        if (signalKeyboardTargetIsGame(e)) {
          if (['F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12'].indexOf(e.key) === -1) {
            e.preventDefault();
          }
        }
      });

      function loadScript(src, onload) {
        var s = document.createElement('script');
        s.src = src;
        if (onload) s.onload = onload;
        document.body.appendChild(s);
        return s;
      }

      function loadGame(src) {
        loadScript(src);
      }

      function failBundle(message) {
        console.error('[boot] ' + message);
        setLoading(message);
      }

      loadScript(signalVersionedAsset('./signal-touch-controls.js'));
      loadGame(signalVersionedAsset('./signal.js'));
    </script>

  </body>
</html>
