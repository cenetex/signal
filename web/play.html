<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta http-equiv="Permissions-Policy" content="cross-origin-isolated=(self)">
    <title>Signal — Play</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap");

      :root {
        color-scheme: dark;
        --bg: #080706;
        --panel: rgba(10, 10, 9, 0.84);
        --line: rgba(245, 239, 223, 0.14);
        --ink: #f5efdf;
        --muted: #cfc3ad;
        --signal: #80ffd5;
        --ore: #f1b566;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background:
          radial-gradient(circle at 16% 18%, rgba(241, 181, 102, 0.08), transparent 26%),
          radial-gradient(circle at 86% 76%, rgba(128, 255, 213, 0.08), transparent 24%),
          var(--bg);
        -webkit-user-select: none;
        user-select: none;
      }

      body {
        color: var(--ink);
        font-family: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--signal);
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: var(--bg);
        transition: opacity 0.4s;
      }

      #loading.done {
        opacity: 0;
        pointer-events: none;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="loading">Linking signal chain...</div>


    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script>
      var canvas = document.getElementById('canvas');

      var Module = {
        canvas: canvas,
        print: function(text) { console.log(text); },
        printErr: function(text) { console.error(text); }
      };

      window.SignalGameModule = Module;

      /* ?singleplayer=1 forces the in-process server for local smoke
       * tests and client-only iteration. Otherwise, default
       * SIGNAL_SERVER to the local docker websocket when this
       * page is served from localhost / 127.0.0.1 / a private LAN IP.
       * Without this, opening http://localhost:8080/signal.html stays in
       * singleplayer and the docker signal_server on :9091 is unused —
       * which means no global highscores, no other players, no chain.
       * Production CDN sets window.SIGNAL_SERVER explicitly before this
       * script runs, so this default never fires there. */
      function isLocalHostName(h) {
        return (h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0'
             || /^192\.168\./.test(h) || /^10\./.test(h)
             || /^172\.(1[6-9]|2[0-9]|3[01])\./.test(h));
      }

      var signalParams = new URLSearchParams(window.location.search);
      var signalHost = window.location.hostname;
      var signalHostIsLocal = isLocalHostName(signalHost);
      window.SIGNAL_RELAY_DEBUG = window.SIGNAL_RELAY_DEBUG || {};

      function setRelayDebug(fields) {
        var dbg = window.SIGNAL_RELAY_DEBUG || {};
        Object.keys(fields).forEach(function(k) { dbg[k] = fields[k]; });
        window.SIGNAL_RELAY_DEBUG = dbg;
      }

      function nowMs() {
        return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      }

      if (signalParams.has('singleplayer')) window.SIGNAL_SERVER = '';
      else if (signalParams.has('server')) window.SIGNAL_SERVER = signalParams.get('server');
      if (!signalParams.has('singleplayer') && !window.SIGNAL_SERVER) {
        if (signalHostIsLocal) window.SIGNAL_SERVER = 'ws://' + signalHost + ':9091/ws';
      }

      function setLoading(message) {
        document.getElementById('loading').textContent = message;
      }

      function clientTimezone() {
        try {
          return Intl.DateTimeFormat().resolvedOptions().timeZone || '';
        } catch (e) {
          return '';
        }
      }

      function resolveRelayServer() {
        if (window.SIGNAL_SERVER || signalParams.has('singleplayer')) {
          setRelayDebug({
            brokered: false,
            region: signalParams.has('singleplayer') ? 'solo' : (signalHostIsLocal ? 'local' : 'direct'),
            preferredRegion: '',
            brokerLatencyMs: 0,
            healthLatencyMs: 0,
            launched: false
          });
          return Promise.resolve({ ws: window.SIGNAL_SERVER || '', brokered: false });
        }
        var broker = window.SIGNAL_RELAY_BROKER || signalParams.get('relayBroker');
        if (!broker) return Promise.resolve({ ws: '', brokered: false });

        var tz = clientTimezone();
        var preferredRegion = signalParams.get('region');
        var url = new URL(broker, window.location.href);
        if (preferredRegion) url.searchParams.set('region', preferredRegion);
        if (tz) url.searchParams.set('tz', tz);

        setLoading('Finding a nearby game server...');
        setRelayDebug({
          brokered: true,
          region: preferredRegion || 'selecting',
          preferredRegion: preferredRegion || '',
          brokerLatencyMs: 0,
          healthLatencyMs: 0,
          launched: false
        });
        var brokerStarted = nowMs();
        return fetch(url.toString(), { cache: 'no-store' })
          .then(function(r) {
            if (!r.ok) throw new Error('Relay broker returned ' + r.status);
            return r.json();
          })
          .then(function(info) {
            if (!info || !info.server) throw new Error('Relay broker did not return a server');
            window.SIGNAL_SERVER = info.server;
            var brokerEnded = nowMs();
            setRelayDebug({
              brokered: true,
              region: info.region || preferredRegion || 'selected',
              preferredRegion: info.preferredRegion || preferredRegion || '',
              brokerLatencyMs: Math.max(0, Math.round(brokerEnded - brokerStarted)),
              launched: !!info.launched
            });
            return { ws: info.server, brokered: true };
          });
      }

      canvas.addEventListener('pointerdown', function() {
        canvas.focus();
      });

      /* Prevent browser from stealing game keys. Tab is a docked-UI key
       * now (tab strip cycling) so we must preventDefault on it too;
       * otherwise focus escapes the canvas on the first Tab press. */
      window.addEventListener('keydown', function(e) {
        if (document.activeElement === canvas || e.target === document.body) {
          if (['F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12'].indexOf(e.key) === -1) {
            e.preventDefault();
          }
        }
      });

      function loadGame(src, version) {
        /* Cache-bust both signal.js and the wasm fetch by routing
         * through Module.locateFile. Without this, browsers happily
         * keep the previous build's bundle and the HUD shows
         * "syncing..." forever (client_hash != server_hash). */
        if (version) {
          var bust = (src.indexOf('?') >= 0 ? '&' : '?') + 'v=' + encodeURIComponent(version);
          src = src + bust;
          var prevLocate = Module.locateFile;
          Module.locateFile = function(path, prefix) {
            var base = prevLocate ? prevLocate(path, prefix) : ((prefix || '') + path);
            return base + (base.indexOf('?') >= 0 ? '&' : '?') + 'v=' + encodeURIComponent(version);
          };
        }
        var s = document.createElement('script');
        s.src = src;
        s.onload = function() {
          document.getElementById('loading').classList.add('done');
          canvas.focus();
        };
        document.body.appendChild(s);
      }

      function failBundle(message) {
        console.error('[boot] ' + message);
        setLoading(message);
      }

      function delay(ms) {
        return new Promise(function(resolve) { setTimeout(resolve, ms); });
      }

      function fetchHealthWithRetry(healthUrl, timeoutMs, brokered) {
        var started = Date.now();
        function attempt() {
          var healthStarted = nowMs();
          return fetch(healthUrl, { cache: 'no-store' })
            .then(function(r) {
              if (!r.ok) throw new Error('Relay health returned ' + r.status);
              return r.json();
            })
            .then(function(info) {
              var healthEnded = nowMs();
              setRelayDebug({
                healthLatencyMs: Math.max(0, Math.round(healthEnded - healthStarted))
              });
              return info;
            })
            .catch(function(err) {
              if (Date.now() - started >= timeoutMs) throw err;
              if (brokered) setLoading('Waking game server...');
              return delay(1500).then(attempt);
            });
        }
        return attempt();
      }

      /* Pin the WASM bundle to whatever version the server is running.
       * Prevents silent wire desync when the server lags behind the CDN:
       * if /play/v/<server_hash>/ exists on CDN, we load that bundle
       * instead of ./signal.js (which may have newer wire format).
       * Local/dev builds may fall back to the root bundle because they do
       * not usually have a local /play/v/<hash>/ archive. Production must
       * fail closed instead of loading a client that may be ahead of ECS. */
      function pickBundle(ws, brokered) {
        if (!ws) { loadGame('./signal.js'); return; }
        var healthUrl = ws.replace(/^ws/, 'http').replace(/\/ws$/, '/health');
        var allowRootFallback = signalHostIsLocal;
        var fallbackOrFail = function(version) {
          if (allowRootFallback) loadGame('./signal.js', version);
          else failBundle('Relay build unavailable. Refresh shortly.');
        };
        var healthTimeoutMs = brokered
          ? (Number(window.SIGNAL_RELAY_START_TIMEOUT_MS) || 90000)
          : 3000;

        fetchHealthWithRetry(healthUrl, healthTimeoutMs, brokered)
          .then(function(info) {
            var v = info && info.version;
            if (!v || v === 'dev') { fallbackOrFail(); return; }
            var pinned = '/play/v/' + encodeURIComponent(v) + '/signal.js';
            fetch(pinned, { method: 'HEAD' })
              .then(function(r) { r.ok ? loadGame(pinned, v) : fallbackOrFail(v); })
              .catch(function() { fallbackOrFail(v); });
          })
          .catch(function() {
            fallbackOrFail();
          });
      }

      resolveRelayServer()
        .then(function(relay) { pickBundle(relay.ws, relay.brokered); })
        .catch(function(err) {
          failBundle(err && err.message ? err.message : 'Relay unavailable. Refresh shortly.');
        });
    </script>
    <script src="./signal-touch-controls.js"></script>
  </body>
</html>
