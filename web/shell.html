<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta http-equiv="Permissions-Policy" content="cross-origin-isolated=(self)">
    <title>Signal</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "IBM Plex Mono", "SFMono-Regular", ui-monospace, monospace;
        background:
          radial-gradient(circle at top, rgba(40, 70, 120, 0.25), transparent 40%),
          linear-gradient(180deg, #09111f 0%, #04070c 100%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        color: #dce9ff;
        -webkit-user-select: none;
        user-select: none;
      }

      .shell {
        width: 100vw;
        height: 100dvh;
      }

      .hero {
        display: none;
      }

      .hero-copy {
        display: none;
      }

      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(150, 198, 255, 0.74);
      }

      .title {
        font-size: clamp(20px, 2.8vw, 34px);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .subtitle {
        font-size: 13px;
        color: rgba(220, 233, 255, 0.72);
      }

      .frame {
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
        background: transparent;
        position: relative;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }

      @media (max-width: 760px), (max-height: 680px) {
        .hero {
          display: none;
        }
      }

    </style>
  </head>
  <body>
    <div class="shell">
      <div class="hero">
        <div class="hero-copy">
          <div class="eyebrow">Industrial Frontier</div>
          <div class="title">Signal</div>
          <div class="subtitle">Keep the belt connected.</div>
        </div>
      </div>
      <div class="frame">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      </div>
    </div>
    <script>
      var Module = {
        canvas: document.getElementById("canvas"),
        print: function (text) {
          console.log(text);
        },
        printErr: function (text) {
          console.error(text);
        }
      };
      window.SignalGameModule = Module;

      /* ?singleplayer=1 forces the in-process server.
       * ?server=ws://... connects to an explicit multiplayer relay.
       * Otherwise defaults to singleplayer. */
      var signalParams = new URLSearchParams(window.location.search);
      if (signalParams.has('singleplayer')) window.SIGNAL_SERVER = '';
      else if (signalParams.has('server')) window.SIGNAL_SERVER = signalParams.get('server');
      else window.SIGNAL_SERVER = '';
    </script>
    <script src="./signal-touch-controls.js"></script>
    {{{ SCRIPT }}}
  </body>
</html>
