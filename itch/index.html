<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Signal</title>
<style>
  :root { color-scheme: dark; background: #05060a; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  #fallback {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #9fb4d8; font: 16px system-ui, sans-serif;
  }
  #fallback a { color: #9fb4d8; }
  #fallback[hidden] { display: none; }
</style>
</head>
<body>
<iframe id=game src="https://signal.ratimics.com/play.html"
        title="Signal"
        allow="autoplay; fullscreen; gamepad; clipboard-write"
        referrerpolicy="origin"></iframe>
<div id=fallback hidden>
  <p>Signal could not load here. <a href="https://signal.ratimics.com/play" target=_blank>Play at signal.ratimics.com</a></p>
</div>
<script>
  const game = document.getElementById("game");
  const fallback = document.getElementById("fallback");
  game.addEventListener("load", () => game.contentWindow.focus());
  window.addEventListener("error", () => fallback.hidden = false);
</script>
</body>
</html>
